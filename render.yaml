services:
  - type: web
    name: youtube-downloader
    env: python
    buildCommand: "./build.sh"
    startCommand: "python server.py"
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DENO_INSTALL
        value: /opt/render/.deno
      - key: PATH
        value: /opt/render/.deno/bin:$PATH
      - key: CHROME_BIN
        value: /usr/bin/google-chrome
      - key: DISPLAY
        value: :99
    disk:
      name: downloads
      mountPath: /opt/render/project/src/downloads
      sizeGB: 1